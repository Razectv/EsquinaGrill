<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pedidos - Atendentes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAMP2BCzSLRDxYBc7VZNNoyo1DzZyS0QHo",
      authDomain: "esquinagrill-ffdfa.firebaseapp.com",
      databaseURL: "https://esquinagrill-ffdfa-default-rtdb.firebaseio.com",
      projectId: "esquinagrill-ffdfa",
      storageBucket: "esquinagrill-ffdfa.firebasestorage.app",
      messagingSenderId: "1070759893350",
      appId: "1:1070759893350:web:91379975c8cc6741b750a7",
      measurementId: "G-PKBXHQZD9W"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
  </script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">📋 Registrar Pedido</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <form id="pedidoForm" class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Mesa</label>
            <input type="number" id="mesa" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Item</label>
            <input type="text" id="item" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Preço</label>
            <input type="number" id="preco" class="form-control" step="0.01" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Quantidade</label>
            <input type="number" id="quantidade" class="form-control" value="1" min="1" required>
          </div>
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-success mt-3">Enviar Pedido2</button>
          </div>
        </form>
      </div>
    </div>

    <div id="status" class="mt-3 text-center"></div>

    <div class="text-center mt-4">
      <button class="btn btn-primary" onclick="window.location.href='balcao.html'">Ir para Balcão</button>
    </div>
  </div>

  <script>
    document.getElementById("pedidoForm").addEventListener("submit", e => {
      e.preventDefault();

      const pedido = {
        mesa: document.getElementById("mesa").value,
        item: document.getElementById("item").value,
        preco: parseFloat(document.getElementById("preco").value),
        quantidade: parseInt(document.getElementById("quantidade").value)
      };

      db.ref("pedidos").push(pedido)
        .then(() => {
          document.getElementById("status").innerHTML =
            `<div class="alert alert-success">✅ Pedido enviado!</div>`;
          document.getElementById("pedidoForm").reset();
        })
        .catch(error => {
          document.getElementById("status").innerHTML =
            `<div class="alert alert-danger">❌ Erro: ${error.message}</div>`;
        });
    });
  </script>
</body>
</html>
