<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">🍽️ Controle de Mesas</h2>
<div class="text-center mb-4">
  <button class="btn btn-primary" onclick="irParaPedidos()">Ir para Página de Pedidos</button>
</div>

<script>
  function irParaPedidos() {
    // Aqui você coloca o caminho do site1.html
    window.location.href = "pedidos.html";
  }
</script>

    <!-- Área de pedidos -->
    <div id="pedidos"></div>
  </div>

  <script>
    async function carregarPedidos() {
      try {
        const res = await fetch("http://localhost:3000/api/pedidos");
        const pedidos = await res.json();
        let html = "";
        const mesas = {};

        // Agrupar pedidos por mesa
        pedidos.forEach(p => {
          if (!mesas[p.mesa]) mesas[p.mesa] = [];
          mesas[p.mesa].push(p);
        });

        // Montar HTML
        for (const mesa in mesas) {
          let total = 0;
          html += `<div class="card shadow-sm mb-4">
                    <div class="card-body">
                      <h5 class="card-title">Mesa ${mesa}</h5>
                      <table class="table table-striped">
                        <thead>
                          <tr>
                            <th>Item</th>
                            <th>Preço</th>
                            <th>Qtd</th>
                            <th>Total</th>
                          </tr>
                        </thead>
                        <tbody>`;
          mesas[mesa].forEach(p => {
            const subtotal = p.preco * p.quantidade;
            total += subtotal;
            html += `<tr>
                      <td>${p.item}</td>
                      <td>R$${p.preco.toFixed(2)}</td>
                      <td>${p.quantidade}</td>
                      <td>R$${subtotal.toFixed(2)}</td>
                    </tr>`;
          });
          html += `</tbody></table>
                   <p class="fw-bold text-success">Total da Mesa ${mesa}: R$${total.toFixed(2)}</p>
                   <button class="btn btn-danger btn-sm" onclick="fecharConta('${mesa}')">Fechar Conta</button>
                   </div></div>`;
        }

        document.getElementById("pedidos").innerHTML = html;
      } catch (error) {
        document.getElementById("pedidos").innerHTML = 
          `<div class="alert alert-danger">⚠️ Não foi possível carregar pedidos.</div>`;
      }
    }

    // Função para fechar conta (limpar pedidos da mesa)
    async function fecharConta(mesa) {
      alert(`Conta da Mesa ${mesa} fechada! (Aqui você pode integrar com pagamento ou limpar do banco de dados)`);
    }

    // Atualiza pedidos a cada 3 segundos
    setInterval(carregarPedidos, 3000);
    carregarPedidos();
  </script>
