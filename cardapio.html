<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pedidos - Esquina Grill</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background-image: url('fundo.jpg'); /* sua imagem de fundo */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.3);
      z-index: -1;
    }
    h2 {
      color: #FFD700;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }
    .mesa-label {
      color: #FFD700;
      font-weight: bold;
    }
    .card {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card-img-top {
      height: 120px;       /* imagens menores */
      object-fit: cover;   /* corta proporcional */
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMP2BCzSLRDxYBc7VZNNoyo1DzZyS0QHo",
      authDomain: "esquinagrill-ffdfa.firebaseapp.com",
      databaseURL: "https://esquinagrill-ffdfa-default-rtdb.firebaseio.com",
      projectId: "esquinagrill-ffdfa",
      storageBucket: "esquinagrill-ffdfa.firebasestorage.app",
      messagingSenderId: "1070759893350",
      appId: "1:1070759893350:web:91379975c8cc6741b750a7",
      measurementId: "G-PKBXHQZD9W"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let carrinho = [];

    window.selecionarItem = function(item, preco) {
      carrinho.push({ item, preco, quantidade: 1 });
      atualizarCarrinho();
    }

    function atualizarCarrinho() {
      const div = document.getElementById("carrinho");
      div.innerHTML = "<h5>Itens selecionados:</h5>";
      carrinho.forEach((p, i) => {
        div.innerHTML += `<p>${p.item} - R$${p.preco.toFixed(2)} 
          <button class="btn btn-sm btn-danger" onclick="removerItem(${i})">Remover</button></p>`;
      });
    }

    window.removerItem = function(index) {
      carrinho.splice(index, 1);
      atualizarCarrinho();
    }

    window.registrarPedido = function() {
      const mesa = document.getElementById("mesa").value;
      if (!mesa) {
        alert("Digite o número da mesa!");
        return;
      }
      if (carrinho.length === 0) {
        alert("Nenhum item selecionado!");
        return;
      }

      carrinho.forEach(p => {
        const pedido = { mesa, item: p.item, preco: p.preco, quantidade: p.quantidade };
        push(ref(db, "pedidos"), pedido);
      });

      alert("✅ Pedido registrado com sucesso!");
      carrinho = [];
      atualizarCarrinho();
    }
  </script>
</head>
<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">🍽️ Pedidos - Esquina Grill</h2>

    <!-- Campo da mesa -->
    <div class="mb-3 text-center">
      <label class="form-label mesa-label">Mesa:</label>
      <input type="number" id="mesa" class="form-control w-25 d-inline-block" placeholder="Nº da mesa">
    </div>

    <!-- Cardápio ilustrado em duas colunas -->
    <div class="row">
      <div class="col-6 mb-3">
        <div class="card h-100" onclick="selecionarItem('Galinha Caipira', 40)">
          <img src="galinha.jpg" class="card-img-top" alt="Galinha Caipira">
          <div class="card-body text-center">
            <h5 class="card-title">Galinha Caipira</h5>
            <p class="card-text">R$40,00</p>
          </div>
        </div>
      </div>

      <div class="col-6 mb-3">
        <div class="card h-100" onclick="selecionarItem('Feijoada', 38)">
          <img src="feijoada.jpg" class="card-img-top" alt="Feijoada">
          <div class="card-body text-center">
            <h5 class="card-title">Feijoada</h5>
            <p class="card-text">R$38,00</p>
          </div>
        </div>
      </div>

      <div class="col-6 mb-3">
        <div class="card h-100" onclick="selecionarItem('Caranguejo', 38)">
          <img src="caranguejo.jpg" class="card-img-top" alt="Caranguejo">
          <div class="card-body text-center">
            <h5 class="card-title">Caranguejo</h5>
            <p class="card-text">R$38,00</p>
          </div>
        </div>
      </div>

      <div class="col-6 mb-3">
        <div class="card h-100" onclick="selecionarItem('Strogonoff de Frango', 30)">
          <img src="strogonoff.jpg" class="card-img-top" alt="Strogonoff de Frango">
          <div class="card-body text-center">
            <h5 class="card-title">Strogonoff de Frango</h5>
            <p class="card-text">R$30,00</p>
          </div>
        </div>
      </div>

      <!-- Repete para os outros pratos e sobremesas -->
    </div>

    <!-- Carrinho -->
    <div id="carrinho" class="mt-4 card p-3"></div>

    <!-- Botão registrar -->
    <div class="text-center mt-4">
      <button class="btn btn-success btn-lg" onclick="registrarPedido()">Registrar Pedido</button>
    </div>
  </div>
</body>
</html>
