<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Balcão - Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAMP2BCzSLRDxYBc7VZNNoyo1DzZyS0QHo",
      authDomain: "esquinagrill-ffdfa.firebaseapp.com",
      databaseURL: "https://esquinagrill-ffdfa-default-rtdb.firebaseio.com",
      projectId: "esquinagrill-ffdfa",
      storageBucket: "esquinagrill-ffdfa.firebasestorage.app",
      messagingSenderId: "1070759893350",
      appId: "1:1070759893350:web:91379975c8cc6741b750a7",
      measurementId: "G-PKBXHQZD9W"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
  </script>
</head>
<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">🍽️ Controle de Mesas</h2>

    <div class="text-center mb-4">
      <button class="btn btn-primary" onclick="window.location.href='index.html'">Ir para Página de Pedidos</button>
    </div>

    <div id="pedidos"></div>
  </div>

  <script>
    function carregarPedidos() {
      db.ref("pedidos").on("value", snapshot => {
        const pedidos = snapshot.val();
        let html = "";
        const mesas = {};

        for (const id in pedidos) {
          const p = pedidos[id];
          if (!mesas[p.mesa]) mesas[p.mesa] = [];
          mesas[p.mesa].push({ ...p, id });
        }

        for (const mesa in mesas) {
          let total = 0;
          html += `<div class="card shadow-sm mb-4">
                    <div class="card-body">
                      <h5 class="card-title">Mesa ${mesa}</h5>
                      <table class="table table-striped">
                        <thead>
                          <tr><th>Item</th><th>Preço</th><th>Qtd</th><th>Total</th></tr>
                        </thead><tbody>`;
          mesas[mesa].forEach(p => {
            const subtotal = p.preco * p.quantidade;
            total += subtotal;
            html += `<tr>
                      <td>${p.item}</td>
                      <td>R$${p.preco.toFixed(2)}</td>
                      <td>${p.quantidade}</td>
                      <td>R$${subtotal.toFixed(2)}</td>
                    </tr>`;
          });
          html += `</tbody></table>
                   <p class="fw-bold text-success">Total da Mesa ${mesa}: R$${total.toFixed(2)}</p>
                   <button class="btn btn-danger btn-sm" onclick="fecharConta('${mesa}')">Fechar Conta</button>
                   </div></div>`;
        }

        document.getElementById("pedidos").innerHTML = html;
      });
    }

    function fecharConta(mesa) {
      db.ref("pedidos").once("value", snapshot => {
        const pedidos = snapshot.val();
        for (const id in pedidos) {
          if (pedidos[id].mesa == mesa) {
            db.ref("pedidos/" + id).remove();
          }
        }
        alert(`Conta da Mesa ${mesa} foi fechada!`);
      });
    }

    carregarPedidos();
  </script>
</body>
</html>
