  body {
    background-image: url('fundo.jpg'); /* coloque o nome da sua imagem */
    background-size: cover;             /* cobre toda a tela */

  /* Cards semi-translúcidos para melhor leitura */

</style>
<script>

  const firebaseConfig = {

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>

<script>
  // Sua configuração do Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAMP2BCzSLRDxYBc7VZNNoyo1DzZyS0QHo",
    authDomain: "esquinagrill-ffdfa.firebaseapp.com",
    databaseURL: "https://esquinagrill-ffdfa-default-rtdb.firebaseio.com",
    projectId: "esquinagrill-ffdfa",
    storageBucket: "esquinagrill-ffdfa.firebasestorage.app",
    messagingSenderId: "1070759893350",
    appId: "1:1070759893350:web:91379975c8cc6741b750a7",

  };

</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">📋 Registrar Pedido</h2>

    <!-- Formulário -->
    <div class="card shadow-sm">
      <div class="card-body">
        <form id="pedidoForm" class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Mesa</label>
            <input type="number" id="mesa" class="form-control" placeholder="Nº da mesa" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Item</label>
            <input type="text" id="item" class="form-control" placeholder="Nome do item" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Preço</label>
            <input type="number" id="preco" class="form-control" placeholder="R$" step="0.01" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Quantidade</label>
            <input type="number" id="quantidade" class="form-control" value="1" min="1" required>
          </div>
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-success mt-3">Enviar Pedido</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Mensagem de status -->
    <div id="status" class="mt-3 text-center"></div>
  </div>

  <script>
    document.getElementById("pedidoForm").addEventListener("submit", async e => {
      e.preventDefault();

      const pedido = {
        mesa: document.getElementById("mesa").value,
        item: document.getElementById("item").value,
        preco: parseFloat(document.getElementById("preco").value),
        quantidade: parseInt(document.getElementById("quantidade").value)
      };

      try {
        // Envia para o servidor central (API)
        const res = await fetch("http://localhost:3000/api/pedidos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(pedido)
        });

        if (res.ok) {
          document.getElementById("status").innerHTML = 
            `<div class="alert alert-success">✅ Pedido enviado com sucesso!</div>`;
          document.getElementById("pedidoForm").reset();
        } else {
          document.getElementById("status").innerHTML = 
            `<div class="alert alert-danger">❌ Erro ao enviar pedido.</div>`;
        }
      } catch (error) {
        document.getElementById("status").innerHTML = 
          `<div class="alert alert-danger">⚠️ Não foi possível conectar ao servidor.</div>`;
      }
    });
  </script>
</body>
</html>
